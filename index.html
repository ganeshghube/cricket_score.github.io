<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Cricket Overlay — Live Match Centre</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none; /* better for overlay */
        }
        body {
            background: #0a0c12;
            font-family: 'Barlow Condensed', sans-serif;
            color: #f0f2f5;
            overflow-x: hidden;
        }
        /* MAIN LAYOUT */
        .live-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 12px;
        }
        /* SCOREBOARD (top card) */
        .scorecard-glass {
            background: linear-gradient(145deg, #12161f, #0b0e14);
            border-radius: 28px;
            padding: 20px 24px;
            margin-bottom: 20px;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.7);
            border: 1px solid rgba(255,215,0,0.2);
        }
        .team-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 12px;
        }
        .team-name {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #fff, #ffd966);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .score-total {
            font-size: 54px;
            font-weight: 900;
            line-height: 1;
        }
        .score-detail {
            font-size: 20px;
            color: #aaa;
        }
        .overs-row {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            font-size: 16px;
            color: #b0b3c0;
        }
        .target-box {
            background: #e6394633;
            padding: 6px 14px;
            border-radius: 40px;
            font-weight: 700;
        }
        /* BATTER & BOWLER cards */
        .stats-grid {
            display: grid;
            grid-template-columns: 2fr 1.2fr;
            gap: 18px;
            margin: 20px 0;
        }
        .batter-card {
            background: #10131e;
            border-radius: 24px;
            padding: 16px;
            border-left: 6px solid #f5c518;
        }
        .batter-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #2a2e3c;
        }
        .batter-name {
            font-size: 26px;
            font-weight: 700;
        }
        .batter-stats {
            font-size: 24px;
            font-weight: 800;
        }
        .bowler-card {
            background: #10131e;
            border-radius: 24px;
            padding: 16px;
            border-left: 6px solid #06d6a0;
        }
        /* last 6 balls */
        .last-balls {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 10px;
        }
        .ball-icon {
            width: 42px;
            height: 42px;
            background: #1e212e;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 800;
        }
        .ball-0 { background: #2c2f3a; color: #8e9aaf; }
        .ball-4 { background: #0f6e3f; color: #9effcf; }
        .ball-6 { background: #8b3cff; color: #e2ccff; }
        .ball-W { background: #b91c1c; color: #ffb3b3; }
        .ball-Wd { background: #d48c2c; color: #ffe6b3; }
        .ball-Nb { background: #e67e22; color: #fff0d4; }
        /* COMMENTARY PANEL */
        .commentary-panel {
            background: #0c0f17;
            border-radius: 28px;
            padding: 18px;
            margin-top: 20px;
            border: 1px solid #2a2e3c;
        }
        .comm-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }
        .comm-list {
            height: 320px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-right: 6px;
        }
        .comm-item {
            background: #151c26;
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 16px;
            border-left: 4px solid #f5c518;
            animation: fadeInUp 0.2s ease;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(12px);}
            to { opacity: 1; transform: translateY(0);}
        }
        .audio-controls {
            display: flex;
            gap: 12px;
            align-items: center;
            background: #090c12;
            padding: 10px 18px;
            border-radius: 60px;
        }
        button {
            background: #2a2f3f;
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: 0.1s linear;
        }
        button:active { transform: scale(0.96);}
        .volume-slider {
            width: 100px;
        }
        .live-badge {
            background: #e63946;
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 12px;
            letter-spacing: 1px;
        }
        .rrr-box {
            background: #1f2533;
            border-radius: 20px;
            padding: 8px 16px;
            font-weight: 700;
        }
        /* partnership */
        .partnership {
            font-size: 15px;
            background: #1a1f2c;
            border-radius: 20px;
            padding: 6px 16px;
            display: inline-block;
        }
        @media (max-width: 700px) {
            .stats-grid { grid-template-columns: 1fr; }
            .team-name { font-size: 22px; }
            .score-total { font-size: 38px; }
        }
        .wicket-effect {
            animation: shakeFlash 0.4s ease;
        }
        @keyframes shakeFlash {
            0% { background: #ff4d4d; transform: translateX(0);}
            25% { transform: translateX(-8px);}
            75% { transform: translateX(8px);}
            100% { background: transparent; transform: translateX(0);}
        }
    </style>
</head>
<body>
<div class="live-container">
    <!-- main scoreboard -->
    <div class="scorecard-glass" id="scoreboard">
        <div class="team-row">
            <div><span class="team-name" id="batTeamName">BATTING TEAM</span></div>
            <div><span class="score-total" id="totalScore">0/0</span> <span class="score-detail" id="oversDetail">(0.0)</span></div>
        </div>
        <div class="overs-row">
            <div><span id="crr">CRR: 0.00</span> &nbsp;|&nbsp; <span id="rrrDisplay" class="rrr-box">RRR: --</span></div>
            <div><span class="target-box" id="targetDisplay"></span></div>
            <div><span class="live-badge">● LIVE</span></div>
        </div>
        <div class="stats-grid">
            <div class="batter-card">
                <div class="batter-row" id="strikerBox">
                    <span class="batter-name" id="strikerName">—</span>
                    <span class="batter-stats" id="strikerStats">0(0)</span>
                </div>
                <div class="batter-row" id="nonStrikerBox">
                    <span class="batter-name" id="nonStrikerName">—</span>
                    <span class="batter-stats" id="nonStrikerStats">0(0)</span>
                </div>
                <div class="partnership" id="partnershipDisplay">Partnership: 0(0)</div>
            </div>
            <div class="bowler-card">
                <div style="display: flex; justify-content: space-between;">
                    <span class="batter-name" id="bowlerName">Bowler</span>
                    <span class="batter-stats" id="bowlerFigs">0-0 (0.0)</span>
                </div>
                <div class="last-balls" id="lastBallsContainer">
                    <div class="ball-icon">·</div><div class="ball-icon">·</div><div class="ball-icon">·</div><div class="ball-icon">·</div><div class="ball-icon">·</div><div class="ball-icon">·</div>
                </div>
            </div>
        </div>
    </div>

    <!-- COMMENTARY + AUDIO -->
    <div class="commentary-panel">
        <div class="comm-header">
            <span style="font-size: 22px; font-weight: 800;">🎙️ LIVE COMMENTARY</span>
            <div class="audio-controls">
                <button id="muteBtn">🔊 Mute</button>
                <span>🔊 Vol</span>
                <input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.05" value="0.9">
                <button id="replayLastBtn">↻ Replay last</button>
                <select id="voiceSelect" style="background:#1e2533; color:white; border-radius:20px; padding:4px 8px;">
                    <option value="default">🎙️ English (Default)</option>
                    <option value="Ravi">🇮🇳 Ravi Style (Deep)</option>
                    <option value="Akash">🇮🇳 Akash (Analytical)</option>
                </select>
            </div>
        </div>
        <div class="comm-list" id="commList">
            <div class="comm-item">🏏 Waiting for live action... Commentary will appear here</div>
        </div>
    </div>
</div>

<script type="module">
    // ======================== FIREBASE CONFIG (SAME PROJECT) ========================
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { getDatabase, ref, onValue, get, set, update } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCFSreoo7grP30O3P0dWyI5ADlwTNWGKgU",
        authDomain: "cricket-8e338.firebaseapp.com",
        projectId: "cricket-8e338",
        storageBucket: "cricket-8e338.firebasestorage.app",
        messagingSenderId: "41064243639",
        appId: "1:41064243639:web:d99e0d8f64b1bbca20c832"
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    
    // DOM elements
    const batTeamName = document.getElementById('batTeamName');
    const totalScoreSpan = document.getElementById('totalScore');
    const oversDetailSpan = document.getElementById('oversDetail');
    const crrSpan = document.getElementById('crr');
    const rrrDisplay = document.getElementById('rrrDisplay');
    const targetDisplay = document.getElementById('targetDisplay');
    const strikerNameSpan = document.getElementById('strikerName');
    const strikerStatsSpan = document.getElementById('strikerStats');
    const nonStrikerNameSpan = document.getElementById('nonStrikerName');
    const nonStrikerStatsSpan = document.getElementById('nonStrikerStats');
    const bowlerNameSpan = document.getElementById('bowlerName');
    const bowlerFigsSpan = document.getElementById('bowlerFigs');
    const lastBallsContainer = document.getElementById('lastBallsContainer');
    const partnershipDisplay = document.getElementById('partnershipDisplay');
    const commList = document.getElementById('commList');
    
    let currentMatchId = null;
    let currentData = null;
    let lastCommentaryText = "";
    let speechQueue = [];
    let isSpeaking = false;
    let audioEnabled = true;
    let synth = window.speechSynthesis;
    let selectedVoice = null;
    let currentVolume = 0.9;
    
    // UI Controls
    const muteBtn = document.getElementById('muteBtn');
    const volumeSlider = document.getElementById('volumeSlider');
    const replayLastBtn = document.getElementById('replayLastBtn');
    const voiceSelect = document.getElementById('voiceSelect');
    
    // helper: update UI from match data
    function updateUI(d) {
        if (!d) return;
        // team & score
        batTeamName.innerText = d.batTeam || "BATTING";
        totalScoreSpan.innerText = `${d.runs || 0}/${d.wkts || 0}`;
        const overs = `${Math.floor((d.balls||0)/6)}.${(d.balls||0)%6}`;
        oversDetailSpan.innerText = `(${overs})`;
        const crrVal = (d.balls || 0) > 0 ? ((d.runs / (d.balls/6)).toFixed(2)) : "0.00";
        crrSpan.innerText = `CRR: ${crrVal}`;
        // target / RRR
        if (d.target && d.innings === 2) {
            const runsNeeded = Math.max(0, d.target - d.runs);
            const ballsLeft = (d.maxOvers * 6) - (d.balls||0);
            const rrr = ballsLeft > 0 ? (runsNeeded / (ballsLeft/6)).toFixed(2) : "∞";
            rrrDisplay.innerText = `RRR: ${rrr}`;
            targetDisplay.innerText = `TARGET ${d.target} • NEED ${runsNeeded}`;
            targetDisplay.style.display = "inline-block";
        } else {
            rrrDisplay.innerText = `RRR: --`;
            targetDisplay.innerText = "";
        }
        // batters
        const striker = d.str === 1 ? d.p1n : d.p2n;
        const strikerR = d.str === 1 ? d.p1r : d.p2r;
        const strikerB = d.str === 1 ? d.p1b : d.p2b;
        const nonStriker = d.str === 1 ? d.p2n : d.p1n;
        const nonStrikerR = d.str === 1 ? d.p2r : d.p1r;
        const nonStrikerB = d.str === 1 ? d.p2b : d.p1b;
        strikerNameSpan.innerText = striker;
        strikerStatsSpan.innerText = `${strikerR}(${strikerB})`;
        nonStrikerNameSpan.innerText = nonStriker;
        nonStrikerStatsSpan.innerText = `${nonStrikerR}(${nonStrikerB})`;
        // partnership (simplified: sum of runs since last wicket)
        const lastWicketIndex = (d.batRows||[]).filter(b => b.out).length;
        const notOutBatters = (d.batRows||[]).filter(b => !b.out);
        let partnershipRuns = 0, partnershipBalls = 0;
        if (notOutBatters.length >= 2) {
            partnershipRuns = notOutBatters[0].runs + notOutBatters[1].runs;
            partnershipBalls = notOutBatters[0].balls + notOutBatters[1].balls;
        } else if (notOutBatters.length === 1) {
            partnershipRuns = notOutBatters[0].runs;
            partnershipBalls = notOutBatters[0].balls;
        }
        partnershipDisplay.innerText = `Partnership: ${partnershipRuns}(${partnershipBalls})`;
        // bowler
        bowlerNameSpan.innerText = d.bwn || "Bowler";
        const bowlRow = (d.bowlRows||[]).find(b => b.name === d.bwn);
        if (bowlRow) {
            const ovs = `${Math.floor(bowlRow.balls/6)}.${bowlRow.balls%6}`;
            bowlerFigsSpan.innerText = `${bowlRow.wkts}-${bowlRow.runs} (${ovs})`;
        } else {
            bowlerFigsSpan.innerText = `0-0 (0.0)`;
        }
        // last 6 balls
        const recent = d.recentBalls || [];
        const ballsHtml = [];
        for (let i = 0; i < 6; i++) {
            let ball = i < recent.length ? recent[i] : null;
            let cls = "ball-icon";
            let symbol = "·";
            if (ball === 0) { symbol = "●"; cls += " ball-0"; }
            else if (ball === 4) { symbol = "4"; cls += " ball-4"; }
            else if (ball === 6) { symbol = "6"; cls += " ball-6"; }
            else if (ball === "W") { symbol = "W"; cls += " ball-W"; }
            else if (typeof ball === "string" && ball.startsWith("Wd")) { symbol = "Wd"; cls += " ball-Wd"; }
            else if (typeof ball === "string" && ball.startsWith("Nb")) { symbol = "Nb"; cls += " ball-Nb"; }
            else if (typeof ball === "number") { symbol = ball; cls += " ball-0"; }
            else symbol = "·";
            ballsHtml.push(`<div class="${cls}">${symbol}</div>`);
        }
        lastBallsContainer.innerHTML = ballsHtml.join('');
    }
    
    // ======================== REALISTIC COMMENTARY GENERATOR ========================
    function generateCommentary(d, prevD, ballEvent, runs, type) {
        // d is current data, prevD is previous snapshot before update
        const striker = d.str === 1 ? d.p1n : d.p2n;
        const bowler = d.bwn;
        const runsScored = runs || 0;
        if (type === 'wicket') {
            return `WICKET! ${striker} is gone! ${bowler} strikes with a crucial breakthrough. The crowd erupts!`;
        }
        if (type === 'four') {
            const phrases = [`FOUR! ${striker} caresses that through the covers for a magnificent boundary!`, `CRACK! Four more, ${striker} is looking in sublime touch.`];
            return phrases[Math.floor(Math.random()*phrases.length)];
        }
        if (type === 'six') {
            return `SIX! That's outta here! ${striker} launches it deep into the stands — maximum! What power!`;
        }
        if (type === 'wide') {
            return `Wide delivery, extra run conceded. ${bowler} will have to reload.`;
        }
        if (type === 'nb') {
            return `No Ball! Free Hit coming up. The batter gets a free swing, and ${runsScored} runs added.`;
        }
        if (type === 'dot') {
            return `Dot ball! Excellent delivery from ${bowler}, beaten all ends up. Pressure building.`;
        }
        if (runsScored === 1) return `Quick single! ${striker} sets off, excellent running between the wickets.`;
        if (runsScored === 2) return `Good running! Two runs, and the fielder hits the stumps but the batter is safe.`;
        if (runsScored === 3) return `Three runs! Aggressive running, the outfield is lightning fast.`;
        if (runsScored === 0 && !type) return `Dot ball! ${bowler} fires in a yorker, ${striker} can't get it away.`;
        return `${runsScored} runs off the ball. The scoreboard ticks over.`;
    }
    
    // Listen to match updates from Firebase
    let activeMatchId = null;
    let prevMatchState = null;
    let lastAnnouncedBallId = 0;
    
    onValue(ref(db, 'activeMatch'), async (snap) => {
        const active = snap.val();
        if (active && active.matchId) {
            currentMatchId = active.matchId;
            const matchRef = ref(db, `matches/${currentMatchId}`);
            onValue(matchRef, (matchSnap) => {
                const newData = matchSnap.val();
                if (!newData) return;
                // detect changes for commentary trigger
                const prev = prevMatchState;
                updateUI(newData);
                if (prev && (prev.runs !== newData.runs || prev.wkts !== newData.wkts || prev.balls !== newData.balls)) {
                    // find ball type
                    let runsInc = newData.runs - (prev.runs || 0);
                    let wicketInc = newData.wkts - (prev.wkts || 0);
                    let ballEventType = null;
                    if (wicketInc > 0) ballEventType = 'wicket';
                    else if (runsInc === 4) ballEventType = 'four';
                    else if (runsInc === 6) ballEventType = 'six';
                    else if ((newData.recentBalls && newData.recentBalls.length > 0)) {
                        let lastBall = newData.recentBalls[newData.recentBalls.length-1];
                        if (typeof lastBall === 'string' && lastBall.startsWith('Wd')) ballEventType = 'wide';
                        else if (typeof lastBall === 'string' && lastBall.startsWith('Nb')) ballEventType = 'nb';
                        else if (runsInc === 0) ballEventType = 'dot';
                    }
                    const commText = generateCommentary(newData, prev, ballEventType, runsInc, ballEventType);
                    if (commText && commText !== lastCommentaryText) {
                        addCommentaryToUI(commText);
                        lastCommentaryText = commText;
                        // push to queue for audio
                        if (audioEnabled) {
                            queueSpeech(commText);
                        }
                    }
                }
                prevMatchState = JSON.parse(JSON.stringify(newData));
                currentData = newData;
            });
        }
    });
    
    function addCommentaryToUI(text) {
        const commentDiv = document.createElement('div');
        commentDiv.className = 'comm-item';
        commentDiv.innerText = `📢 ${text}`;
        commList.prepend(commentDiv);
        if (commList.children.length > 30) commList.removeChild(commList.lastChild);
        // optional boundary animation on scorecard
        if (text.includes('SIX') || text.includes('FOUR')) {
            const board = document.getElementById('scoreboard');
            board.style.transform = 'scale(1.01)';
            setTimeout(() => board.style.transform = '', 150);
        }
        if (text.includes('WICKET')) {
            const board = document.getElementById('scoreboard');
            board.classList.add('wicket-effect');
            setTimeout(() => board.classList.remove('wicket-effect'), 500);
        }
    }
    
    // ======================== AUDIO ENGINE (Web Speech) ========================
    function loadVoices() {
        const voices = synth.getVoices();
        const selected = voiceSelect.value;
        if (selected === 'Ravi') {
            selectedVoice = voices.find(v => v.lang === 'en-IN' && v.name.includes('Google')) || voices.find(v => v.lang === 'en-IN') || voices[0];
        } else if (selected === 'Akash') {
            selectedVoice = voices.find(v => v.lang === 'en-GB' && v.name.includes('Male')) || voices.find(v => v.lang === 'en-GB') || voices[0];
        } else {
            selectedVoice = voices.find(v => v.lang === 'en-US') || voices[0];
        }
    }
    if (synth.onvoiceschanged !== undefined) synth.onvoiceschanged = loadVoices;
    loadVoices();
    
    function queueSpeech(text) {
        if (!audioEnabled) return;
        speechQueue.push(text);
        processQueue();
    }
    function processQueue() {
        if (isSpeaking || speechQueue.length === 0) return;
        isSpeaking = true;
        const nextText = speechQueue.shift();
        const utterance = new SpeechSynthesisUtterance(nextText);
        utterance.rate = 0.92;
        utterance.pitch = 0.95;
        utterance.volume = currentVolume;
        if (selectedVoice) utterance.voice = selectedVoice;
        utterance.onend = () => {
            isSpeaking = false;
            processQueue();
        };
        utterance.onerror = () => {
            isSpeaking = false;
            processQueue();
        };
        synth.speak(utterance);
    }
    function cancelSpeech() {
        synth.cancel();
        isSpeaking = false;
        speechQueue = [];
    }
    // audio controls
    muteBtn.addEventListener('click', () => {
        audioEnabled = !audioEnabled;
        if (!audioEnabled) {
            cancelSpeech();
            muteBtn.innerHTML = "🔇 Muted";
        } else {
            muteBtn.innerHTML = "🔊 Mute";
        }
    });
    volumeSlider.addEventListener('input', (e) => {
        currentVolume = parseFloat(e.target.value);
        if (!audioEnabled) return;
    });
    replayLastBtn.addEventListener('click', () => {
        if (lastCommentaryText && audioEnabled) {
            queueSpeech(lastCommentaryText);
        } else if (lastCommentaryText && !audioEnabled) {
            alert("Audio is muted, unmute first");
        }
    });
    voiceSelect.addEventListener('change', () => { loadVoices(); });
    
    // on first user interaction resume audio context (autoplay policy)
    document.body.addEventListener('click', () => {
        if (synth && synth.paused) synth.resume();
    }, { once: true });
    
    // also watch for firebase commentary node (extra safety)
    if (currentMatchId) {
        const commentaryRef = ref(db, `matches/${currentMatchId}/commentary`);
        onValue(commentaryRef, (snap) => {
            const vals = snap.val();
            if (vals) {
                const entries = Object.values(vals).sort((a,b)=> (a.timestamp||0)-(b.timestamp||0));
                if (entries.length) {
                    const latest = entries[entries.length-1];
                    if (latest.text && latest.text !== lastCommentaryText) {
                        addCommentaryToUI(latest.text);
                        lastCommentaryText = latest.text;
                        if (audioEnabled) queueSpeech(latest.text);
                    }
                }
            }
        });
    }
    
    // fallback empty state
    window.addEventListener('load', () => {
        setTimeout(() => {
            if (!currentMatchId) {
                addCommentaryToUI("⚡ Waiting for admin to start the match...");
            }
        }, 500);
    });
</script>
</body>
</html>
